<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="title" content="NERVA Nodemap">
  <meta name="description" content="Interactive map of NERVA (XNV) nodes around the world">
  <meta name="keywords" content="nerva, xnv, node, map, nodemap, crypto, stats">
  <title>NERVA Nodemap</title>
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="nodemap.css">

  <link rel="preload" href="fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Embed page for the nerva.one iframe: the ?theme= parameter set by
       the parent site wins, so the map follows the site theme. No stats
       and no Chart.js are loaded here; the map is the whole page.
       Keep the #0b111b literal in sync with --clr-bg (dark) in nodemap.css;
       it must stay inline because it runs before the first paint. -->
  <script>(function(){var p=new URLSearchParams(window.location.search),u=p.get('theme'),s;try{s=localStorage.getItem('nerva-nodemap-theme')}catch(e){}var d=u!==null?u==='dark':(s!==null?s==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark-mode');document.documentElement.style.backgroundColor=d?'#0b111b':'';})();</script>

  <script src="vendor/leaflet.js" defer></script>
  <script src="vendor/leaflet.markercluster.js" defer></script>
  <script src="nodemap.js" defer></script>
 </head>

 <body class="embed">
  <main class="page">
    <div class="map-card">
      <div id="map" role="application" aria-label="World map of NERVA nodes"></div>
      <div class="map-overlay">
        <span class="chip"><span class="chip-label">Live&nbsp;</span><span class="mono" data-count="nodes">0</span></span>
        <span class="chip"><span class="chip-label">Countries&nbsp;</span><span class="mono" data-count="countries">0</span></span>
      </div>
      <div id="map-status" class="map-status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span>Loading node list…</span>
      </div>
    </div>
  </main>
 </body>
</html>
